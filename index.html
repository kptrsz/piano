     DALOK — új dal felvételéhez csak ezt az objektumot kell bővíteni.

     Hangjelölés: tudományos hangmagasság-jelölés angol betűkkel,
       C4 = középső C. Módosítás: "#" = kereszt (F#4 = Fisz), "b" = bé
       (Bb3 = B, Eb4 = Esz). A felületen magyar nevek jelennek meg (B → H).
     Hang a dallamban:  HANG[:HOSSZ][@UJJ]   pl. "E4", "D4:8", "G3:h@1"
     Hossz: w = egész, h. = pontozott fél, h = fél, q. = pontozott negyed,
       q = negyed (alapértelmezés), 8 = nyolcad.
     Ujjszám: ha nincs megadva a hangnál, a dal `fingers` táblájából jön.
     Akkordmód ütemei: "Fism" = egész ütem, "G:h C:h" = két fél ütem.
     Gyerekdal: `kids: true` + `picture` (kép a kártyán); a `lyrics` ütemenként
       a jobb kéz hangjaihoz tartozó szótagokat adja szóközzel elválasztva
       ("Bo- ci bo- ci"); a szótagszámnak egyeznie kell a hangok számával.
     Minden ütem hosszát induláskor ellenőrizzük (lásd validateSong).
     =================================================================== -->

<!-- ===================================================================
     MAG — tiszta, DOM-mentes logika (hangok, idővonal, gyakorlás).
     A tests/core.test.mjs Node alatt közvetlenül futtatja.
     =================================================================== -->
<script id="core">
(function (global) {
  "use strict";

  const HANDS = ["right", "left"];
  const EPS = 1e-6;
  const LETTER_SEMITONE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  const LETTER_INDEX = { C: 0, D: 1, E: 2, F: 3, G: 4, A: 5, B: 6 };
  const HU_LETTER = { C: "C", D: "D", E: "E", F: "F", G: "G", A: "A", B: "H" };
  const HU_FLAT = { C: "Cesz", D: "Desz", E: "Esz", F: "Fesz", G: "Gesz", A: "Asz", B: "B" };
  const KEY_NAMES = ["C", "Cisz", "D", "Disz", "E", "F", "Fisz", "G", "Gisz", "A", "B", "H"];
  const BLACK_PCS = [1, 3, 6, 8, 10];
  const DURATIONS = { w: 4, "h.": 3, h: 2, "q.": 1.5, q: 1, "8.": 0.75, "8": 0.5, "16": 0.25 };
  const MODE_LABELS = { melody: "Dallam", chords: "Akkordok" };
  const HAND_LABELS = { right: "Jobb kéz", left: "Bal kéz", both: "Mindkét kéz" };

  const pc = (midi) => ((midi % 12) + 12) % 12;
  const isBlack = (midi) => BLACK_PCS.includes(pc(midi));
  const keyName = (midi) => KEY_NAMES[pc(midi)];
  const beatsPerBar = (meter) => (meter[0] * 4) / meter[1];

  function huName(letter, alter) {
    if (alter === 1) return HU_LETTER[letter] + "isz";
    if (alter === -1) return HU_FLAT[letter];
    return HU_LETTER[letter];
  }

  function parsePitch(str) {
    const m = /^([A-G])(#|b)?(\d)$/.exec(str);
    if (!m) throw new Error(`Ismeretlen hang: "${str}"`);
    const letter = m[1];
    const alter = m[2] === "#" ? 1 : m[2] === "b" ? -1 : 0;
    const octave = Number(m[3]);
    return Object.freeze({
      spelling: str,
      letter,
      alter,
      octave,
      midi: 12 * (octave + 1) + LETTER_SEMITONE[letter] + alter,
      diatonic: octave * 7 + LETTER_INDEX[letter],
      name: huName(letter, alter),
    });
  }

  function parseDuration(code) {
    if (code == null || code === "") return 1;
    const v = DURATIONS[code];
    if (v == null) throw new Error(`Ismeretlen hosszjelölés: "${code}"`);
    return v;
  }

  const TOKEN_RE = /^([A-G](?:#|b)?\d)(?::([^@\s]+))?(?:@([1-5]))?$/;
  function parseToken(token) {
    const m = TOKEN_RE.exec(token);
    if (!m) throw new Error(`Hibás hangjel: "${token}"`);
    return { pitch: parsePitch(m[1]), dur: parseDuration(m[2]), finger: m[3] ? Number(m[3]) : null };
  }

  const splitBar = (bar) => bar.trim().split(/\s+/).filter(Boolean);
  const handHu = (hand) => (hand === "right" ? "jobb" : "bal");

  function fingerFor(song, hand, pitch, explicit) {
    if (explicit != null) return explicit;
    const map = song.fingers && song.fingers[hand];
    return map && map[pitch.spelling] != null ? map[pitch.spelling] : null;
  }

  function makeEvent(hand, pitch, start, dur, bar, finger, extra) {
    return Object.assign(
      { hand, midi: pitch.midi, pitch, name: pitch.name, start, dur, bar, finger, accent: false, chord: null, lyric: null },
      extra
    );
  }

  function assertBarLength(song, label, barIndex, length, bpb) {
    if (Math.abs(length - bpb) > EPS) {
      throw new Error(`${song.title}: ${label} ${barIndex + 1}. ütem ${length} negyed hosszú, ${bpb} kellene.`);
    }
  }

  function melodyEvents(song, def) {
    const bpb = beatsPerBar(song.meter);
    const events = [];
    let barCount = 0;
    for (const hand of HANDS) {
      const bars = def[hand];
      if (!bars) continue;
      barCount = Math.max(barCount, bars.length);
      const lyrics = hand === "right" ? def.lyrics : null;
      if (lyrics && lyrics.length !== bars.length) {
        throw new Error(`${song.title}: ${lyrics.length} ütemnyi szöveg, ${bars.length} ütem dallam.`);
      }
      bars.forEach((bar, i) => {
        const tokens = splitBar(bar);
        const syllables = lyrics ? splitBar(lyrics[i]) : null;
        if (syllables && syllables.length !== tokens.length) {
          throw new Error(`${song.title}: ${i + 1}. ütem ${syllables.length} szótag, de ${tokens.length} hang.`);
        }
        let t = 0;
        tokens.forEach((tok, j) => {
          const { pitch, dur, finger } = parseToken(tok);
          const extra = syllables ? { lyric: syllables[j] } : undefined;
          events.push(makeEvent(hand, pitch, i * bpb + t, dur, i, fingerFor(song, hand, pitch, finger), extra));
          t += dur;
        });
        assertBarLength(song, `${handHu(hand)} kéz`, i, t, bpb);
      });
    }
    return { events, chordSlots: [], barCount };
  }

  function chordEvents(song, def, arpeggio) {
    const bpb = beatsPerBar(song.meter);
    const events = [];
    const chordSlots = [];
    def.bars.forEach((bar, i) => {
      let t = 0;
      for (const tok of splitBar(bar)) {
        const [id, durCode] = tok.split(":");
        const chord = def.harmony[id];
        if (!chord) throw new Error(`${song.title}: ismeretlen akkord "${id}" (${i + 1}. ütem).`);
        const dur = durCode ? parseDuration(durCode) : bpb - t;
        const start = i * bpb + t;
        const notes = chord.right.map(parsePitch);
        const fingers = chord.fingers || [];
        const fingerAt = (j) => (fingers[j] != null ? fingers[j] : null);
        chordSlots.push({ bar: i, start, dur, id, name: chord.name, notes: notes.map((p) => p.name) });

        if (arpeggio && def.arpeggio) {
          const unit = parseDuration(def.arpeggio.unit);
          const order = def.arpeggio.order;
          for (let at = 0, k = 0; at < dur - EPS; at += unit, k++) {
            const j = order[k % order.length];
            events.push(makeEvent("right", notes[j], start + at, Math.min(unit, dur - at), i, fingerAt(j), { chord: id }));
          }
        } else {
          const step = !def.rhythm || def.rhythm === "slot" ? dur : parseDuration(def.rhythm);
          for (let at = 0, k = 0; at < dur - EPS; at += step, k++) {
            const accent = !!def.accentFirst && k === 0;
            notes.forEach((p, j) =>
              events.push(makeEvent("right", p, start + at, Math.min(step, dur - at), i, fingerAt(j), { chord: id, accent }))
            );
          }
        }

        const bass = parsePitch(chord.bass);
        const bassFinger = chord.bassFinger != null ? chord.bassFinger : fingerFor(song, "left", bass, null);
        events.push(makeEvent("left", bass, start, dur, i, bassFinger != null ? bassFinger : 5, { chord: id }));
        t += dur;
      }
      assertBarLength(song, "akkord", i, t, bpb);
    });
    return { events, chordSlots, barCount: def.bars.length };
  }

  const availableModes = (song) => ["melody", "chords"].filter((m) => song.modes[m]);
  const hasArpeggio = (song, mode) => !!(song.modes[mode] && song.modes[mode].arpeggio);

  /**
   * A dal kiválasztott módjából és kezéből lépéssorozatot készít.
   * Lépés = az aktív kezek egy időpontban induló hangjai (ezeket kell leütni).
   */
  function buildTimeline(song, { mode, hands = "both", arpeggio = false }) {
    const def = song.modes[mode];
    if (!def) throw new Error(`${song.title}: nincs "${mode}" mód.`);
    const raw = mode === "melody" ? melodyEvents(song, def) : chordEvents(song, def, arpeggio);
    const active = hands === "both" ? HANDS : [hands];
    const handOrder = (h) => HANDS.indexOf(h);
    const events = raw.events
      .filter((e) => active.includes(e.hand))
      .sort((a, b) => a.start - b.start || handOrder(a.hand) - handOrder(b.hand) || b.midi - a.midi);
    const bpb = beatsPerBar(song.meter);

    const steps = [];
    for (const e of events) {
      let last = steps[steps.length - 1];
      if (!last || Math.abs(last.start - e.start) > EPS) {
        last = { index: steps.length, start: e.start, bar: e.bar, notes: [], accent: false, chord: null, dur: 0 };
        steps.push(last);
      }
      last.notes.push(e);
      if (e.accent) last.accent = true;
    }
    steps.forEach((s, i) => {
      const barEnd = (s.bar + 1) * bpb;
      const next = steps[i + 1];
      s.dur = Math.min(next ? next.start : barEnd, barEnd) - s.start;
      const slot = raw.chordSlots.find((c) => s.start >= c.start - EPS && s.start < c.start + c.dur - EPS);
      s.chord = slot || null;
    });

    const bars = Array.from({ length: raw.barCount }, (_, i) => ({ index: i, start: i * bpb, steps: [] }));
    steps.forEach((s) => bars[s.bar].steps.push(s.index));

    return {
      songId: song.id, mode, hands, arpeggio: !!(arpeggio && def.arpeggio),
      meter: song.meter, bpb, barCount: raw.barCount, totalBeats: raw.barCount * bpb,
      steps, bars, chordSlots: raw.chordSlots, events, loop: !!def.loop,
    };
  }

  /** A dal összes hangját lefedő billentyűtartomány, legalább C3–H4 (2 oktáv). */
  function keyboardRange(song) {
    let low = 48, high = 71;
    for (const mode of availableModes(song)) {
      const variants = hasArpeggio(song, mode) ? [false, true] : [false];
      for (const arpeggio of variants) {
        for (const e of buildTimeline(song, { mode, hands: "both", arpeggio }).events) {
          low = Math.min(low, e.midi - pc(e.midi));
          high = Math.max(high, e.midi + (11 - pc(e.midi)));
        }
      }
    }
    return { low, high };
  }

  /** Gyerek billentyűzet: legalább C4–C5 (egy oktáv), fehér billentyűn végződik. */
  function kidsRange(song) {
    let low = 60, high = 72;
    for (const e of buildTimeline(song, { mode: "melody", hands: "right" }).events) {
      low = Math.min(low, e.midi - pc(e.midi));
      high = Math.max(high, e.midi);
    }
    if (isBlack(high)) high += 1;
    return { low, high };
  }

  function songBarCount(song) {
    return Math.max(...availableModes(song).map((mode) => buildTimeline(song, { mode }).barCount));
  }

  /** Hibaüzenetek listája; üres lista = a dal adatai rendben vannak. */
  function validateSong(song) {
    const errors = [];
    if (!song.id || !song.title) errors.push("Hiányzó id vagy cím.");
    if (!Array.isArray(song.meter) || song.meter.length !== 2) errors.push(`${song.title}: hibás ütemmutató.`);
    if (!song.modes || availableModes(song).length === 0) errors.push(`${song.title}: nincs mód megadva.`);
    else if (song.kids && !song.modes.melody) errors.push(`${song.title}: gyerekdalhoz dallam kell.`);
    if (errors.length) return errors;
    for (const mode of availableModes(song)) {
      for (const arpeggio of hasArpeggio(song, mode) ? [false, true] : [false]) {
        try {
          buildTimeline(song, { mode, hands: "both", arpeggio });
        } catch (err) {
          errors.push(err.message);
        }
      }
    }
    return errors;
  }

  const requiredMidis = (step) => [...new Set(step.notes.map((n) => n.midi))];

  /* ---------- Gyakorlás: determinisztikus állapotgép ---------- */

  function sessionInit(stepIndex = 0) {
    return { stepIndex, satisfied: [], stepDone: false, barErrors: 0, barPlayed: 0, finished: false, cleanBars: [], errors: 0 };
  }

  function advance(s, tl, effects) {
    const step = tl.steps[s.stepIndex];
    const nextIndex = s.stepIndex + 1;
    const next = tl.steps[nextIndex];
    if (!next || next.bar !== step.bar) {
      const clean = s.barErrors === 0 && s.barPlayed === tl.bars[step.bar].steps.length;
      if (clean) {
        s.cleanBars = [...s.cleanBars, step.bar];
        effects.push({ type: "barClean", bar: step.bar });

  position: fixed; left: 50%; top: calc(64px + env(safe-area-inset-top)); transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 15px;
  z-index: 30; box-shadow: var(--shadow); white-space: nowrap; pointer-events: none; transition: opacity .25s, transform .25s;
}
.toast.hide { opacity: 0; transform: translate(-50%, -8px); }

/* ---------- Gyerekdalok: kezdőlap ---------- */
.kids-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.kid-card {
  border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 14px; text-align: left; display: flex; flex-direction: column; gap: 8px; min-height: 150px;
}
.kid-card:active { transform: scale(0.98); }
.kid-card .pic {
  width: 60px; height: 60px; border-radius: 18px; background: var(--surface-2);
  display: flex; align-items: center; justify-content: center; font-size: 36px; line-height: 1;
}
.kid-card h3 { margin: 0; font-size: 16px; line-height: 1.25; }
.kid-card p { margin: 0; color: var(--muted); font-size: 13px; }
.kid-card .row { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: auto; }
.note-dots { display: flex; gap: 4px; }
.note-dots i { width: 12px; height: 12px; border-radius: 50%; background: var(--kc); display: block; }
.kid-stars { color: var(--star); font-weight: 800; font-size: 14px; white-space: nowrap; }

/* ---------- Gyerekdalok: játék képernyő ---------- */
.kids-top { display: flex; align-items: center; gap: 8px; padding: 8px 12px; flex: none; }
.kid-btn {
  width: 56px; height: 56px; border-radius: 18px; border: 0; background: var(--surface); color: var(--ink);
  box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center; flex: none;
}
.kid-btn svg { width: 28px; height: 28px; }
.kid-btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.kid-btn:active { transform: scale(0.95); }
.kids-title { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; font-size: 19px; font-weight: 800; }
.kids-title .pic { font-size: 30px; line-height: 1; flex: none; }
.kids-title .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kids-progress { height: 10px; margin: 0 16px; border-radius: 5px; background: var(--surface-2); overflow: hidden; flex: none; }
.kids-progress span {
  display: block; height: 100%; width: 0; border-radius: 5px; transition: width .3s;
  background: linear-gradient(90deg, var(--kc-0), var(--kc-2), var(--kc-4), var(--kc-5), var(--kc-7), var(--kc-9));
}
.bubbles { flex: 30 1 0; min-height: 120px; display: flex; align-items: center; gap: 14px; padding: 8px 20px; overflow: hidden; }
.bubble { flex: none; display: flex; flex-direction: column; align-items: center; gap: 6px; opacity: .7; }
.bubble i {
  display: flex; align-items: center; justify-content: center; width: 54px; height: 54px; border-radius: 50%;
  background: var(--kc); color: #fff; font-style: normal; font-weight: 800; font-size: 22px;
  box-shadow: inset 0 -5px 0 rgba(0, 0, 0, 0.16);
}
.bubble i.light-ink { color: #3d2c00; }
.bubble b { font-size: 16px; font-weight: 700; min-height: 1.3em; }
.bubble.cur { opacity: 1; }
.bubble.cur i { width: min(28vw, 128px); height: min(28vw, 128px); font-size: 46px; animation: bob 1.3s ease-in-out infinite; }
.bubble.cur b { font-size: 24px; }
.bubble.cur.pop i { animation: pop .35s ease-out, bob 1.3s .35s ease-in-out infinite; }
.bubble.wiggle i { animation: wiggle .45s; }
.kids-keys-wrap { flex: 55 1 0; min-height: 170px; padding: 0 8px calc(8px + env(safe-area-inset-bottom)); display: flex; }
.kids-keys .key.w::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 36%;
  background: var(--kc); opacity: .32; border-radius: 0 0 7px 7px; pointer-events: none;
}
.kids-keys .key.w { padding-bottom: 12px; }
.kids-keys .key.w .kl { position: relative; z-index: 1; font-size: 22px; }
.kids-keys .key.kt { background: var(--kc); color: #fff; animation: glow 1.1s ease-in-out infinite; }
.kids-keys .key.kt.light-ink { color: #3d2c00; }
.kids-keys .key.kt::after { opacity: 0; }
.kids-keys .key.kt::before {
  content: "★"; position: absolute; top: 62%; left: 0; right: 0; text-align: center; font-size: 30px; color: #fff;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.25);
}
.kids-keys .key.wiggle { animation: wiggle .45s; }
.kids-keys .key.down { filter: brightness(0.88); }
.spark {
  position: absolute; left: 50%; top: 58%; z-index: 3; pointer-events: none; font-size: 30px; color: var(--star);
  transform: translateX(-50%); animation: spark .7s ease-out forwards; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
}
.kids-done {
  position: absolute; inset: 0; z-index: 5; background: var(--bg); display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 24px;
}
.kids-done .stars { display: flex; gap: 10px; font-size: 64px; line-height: 1; color: var(--star); }
.kids-done .stars span { display: inline-block; animation: star-in .6s both; }
.kids-done .stars span:nth-child(2) { animation-delay: .15s; font-size: 84px; margin-top: -14px; }
.kids-done .stars span:nth-child(3) { animation-delay: .3s; }
.kids-done h2 { font-size: 38px; margin: 0; }
.kids-done .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.kids-done .btn { min-height: 64px; font-size: 20px; padding: 0 28px; border-radius: 20px; }
@keyframes bob { 50% { transform: translateY(-8px); } }
@keyframes pop { from { transform: scale(0.6); } 70% { transform: scale(1.08); } }
@keyframes wiggle { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
@keyframes glow { 50% { filter: brightness(1.15) saturate(1.15); } }
@keyframes spark { to { transform: translate(-50%, -90px) scale(1.4); opacity: 0; } }
@keyframes star-in { from { transform: scale(0) rotate(-90deg); opacity: 0; } 70% { transform: scale(1.2) rotate(10deg); } }
@media (orientation: landscape) and (max-height: 540px) {
  .kids-top { padding: 4px 12px; }
  .kid-btn { width: 48px; height: 48px; }
  .bubbles { flex: 32 1 0; min-height: 96px; padding: 4px 20px; }
  .bubble.cur i { width: 76px; height: 76px; font-size: 34px; }
  .bubble.cur b { font-size: 18px; }
  .bubble i { width: 44px; height: 44px; font-size: 18px; }
}

.sc-chord { fill: var(--muted); font-size: 12px; font-weight: 700; }
.sc-chord.cur { fill: var(--accent); }

.sc-label .f { font-size: 8.5px; font-weight: 800; }
.sc-next { fill: var(--muted); font-size: 11px; font-weight: 700; }
.n-fut { color: var(--ink); }
.n-past { color: var(--muted); opacity: .5; }
.n-cur-right { color: var(--rh); }
.n-cur-left { color: var(--lh); }
.n-done { color: var(--ok); }
.n-fut .f { fill: var(--muted); }
.sc-band-right { fill: var(--rh-soft); }
.sc-band-left { fill: var(--lh-soft); }
.sc-band-both { fill: var(--rh-soft); }
.sc-band { animation: pulse-band 1.6s ease-in-out infinite; }
@keyframes pulse-band { 50% { opacity: .55; } }
@media (prefers-reduced-motion: reduce) {
  .key.tgt-r, .key.tgt-l, .sc-band, .bubble i, .kids-keys .key.kt { animation: none !important; }
}

<div id="overlay" hidden></div>

<script id="app-script">
(function () {
  "use strict";
  const {
    MODE_LABELS, HAND_LABELS, parsePitch, isBlack, keyName, buildTimeline, keyboardRange, kidsRange, songBarCount,
    validateSong, availableModes, hasArpeggio, requiredMidis, sessionInit, sessionReduce, suggestNext,
  } = window.PianoCore;

  /* ================= Tárolás (localStorage, hibatűrően) ================= */
  const Store = {
    prefix: "zongora.v1.",
    get(key, fallback) {
      try {
        const raw = localStorage.getItem(this.prefix + key);
        return raw == null ? fallback : JSON.parse(raw);
      } catch (_) { return fallback; }
    },
    set(key, value) {
      try { localStorage.setItem(this.prefix + key, JSON.stringify(value)); } catch (_) { /* privát mód / tele */ }
    },
    remove(key) {
      try { localStorage.removeItem(this.prefix + key); } catch (_) { /* nincs teendő */ }
    },
  };

  const DEFAULT_SETTINGS = {
    tempo: 60, metronome: false, countIn: true, volume: 0.6, keyLabels: true,
    theme: "auto", practice: false, hands: "right",
  };
  const settings = Object.assign({}, DEFAULT_SETTINGS, Store.get("settings", {}));
  const saveSettings = () => Store.set("settings", settings);

  const Progress = {
    all: Store.get("progress", {}),
    bars(songId) { return this.all[songId] || []; },
    add(songId, bar) {
      const list = this.bars(songId);
      if (list.includes(bar)) return;
      this.all[songId] = [...list, bar].sort((a, b) => a - b);
      Store.set("progress", this.all);
    },
    reset() { this.all = {}; Store.remove("progress"); },
  };

  const DAILY_GOAL_MIN = 10;
  const todayKey = () => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  };
  const PracticeLog = {
    secondsToday() { return (Store.get("log", {})[todayKey()]) || 0; },
    add(seconds) {
      const log = Store.get("log", {});
      const k = todayKey();
      log[k] = (log[k] || 0) + seconds;
      Store.set("log", log);
    },
  };

  /* ================= Hang (Web Audio) ================= */
  const Sound = (() => {
    let ctx = null, master = null, noise = null;
    const voices = [];
    const MAX_VOICES = 40;

    function ensure() {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC({ latencyHint: "interactive" });
        const comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -16; comp.knee.value = 12; comp.ratio.value = 4;
        comp.attack.value = 0.003; comp.release.value = 0.2;
        master = ctx.createGain();
        master.gain.value = 0.9;
        master.connect(comp).connect(ctx.destination);
        const len = Math.floor(ctx.sampleRate * 0.025);
        noise = ctx.createBuffer(1, len, ctx.sampleRate);
        const data = noise.getChannelData(0);
        for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
      }
      if (ctx.state === "suspended") ctx.resume();
      return ctx;
    }

    /** Szintetizált zongoraszerű hang: gyors indítás, exponenciális lecsengés, sötétedő hangszín. */
    function note(midi, when, dur, velocity = 0.8) {
      if (!ensure()) return null;
      const t = Math.max(when != null ? when : ctx.currentTime, ctx.currentTime);
      const f = 440 * Math.pow(2, (midi - 69) / 12);
      const tau = Math.min(1.2, Math.max(0.3, 0.85 * Math.sqrt(262 / f)));
      const out = ctx.createGain();
      const filter = ctx.createBiquadFilter();
      filter.type = "lowpass";
      filter.Q.value = 0.5;
      filter.frequency.setValueAtTime(Math.min(f * 10, 10000), t);
      filter.frequency.setTargetAtTime(Math.max(f * 2.5, 800), t + 0.01, 0.3);
      const peak = 0.3 * velocity;
      out.gain.setValueAtTime(0.0001, t);
      out.gain.linearRampToValueAtTime(peak, t + 0.005);
      out.gain.setTargetAtTime(0.0001, t + 0.005, tau);
      let end = t + tau * 5;
      if (dur != null) {
        const release = t + Math.max(dur, 0.2);
        out.gain.setTargetAtTime(0.0001, release, 0.08);
        end = Math.min(end, release + 0.5);
      }
      const partials = [[1, "triangle", 1], [2, "sine", 0.4], [3, "sine", 0.12], [4.02, "sine", 0.05]];
      const oscs = partials.map(([mult, type, gain]) => {
        const o = ctx.createOscillator();
        o.type = type;
        o.frequency.value = f * mult;
        const g = ctx.createGain();
        g.gain.value = gain;
        o.connect(g).connect(filter);
        o.start(t);
        o.stop(end);
        return o;
      });
      filter.connect(out).connect(master);
      const voice = {
        start: t,
        cancel() { const now = ctx.currentTime; oscs.forEach((o) => { try { o.stop(Math.max(now, t)); } catch (_) { /* már leállt */ } }); },
      };
      oscs[0].onended = () => {
        out.disconnect();
        const i = voices.indexOf(voice);
        if (i >= 0) voices.splice(i, 1);
      };
      voices.push(voice);
      if (voices.length > MAX_VOICES) voices.shift().cancel();
      return voice;
    }

    function click(when, accent, volume) {
      if (!ensure() || volume <= 0) return;
      const src = ctx.createBufferSource();
      src.buffer = noise;
      const bp = ctx.createBiquadFilter();
      bp.type = "bandpass";
      bp.frequency.value = accent ? 3400 : 2300;
      bp.Q.value = 1.4;
      const g = ctx.createGain();
      g.gain.value = (accent ? 1.0 : 0.6) * volume;
      src.connect(bp).connect(g).connect(master);
      src.start(when);
    }

    return {
      ensure, note, click,
      get ctx() { return ctx; },
      now: () => (ctx ? ctx.currentTime : 0),
      /** Ami most szól (a kimeneti késleltetéssel korrigálva) — a vizuális szinkronhoz. */
      heardTime: () => (ctx ? ctx.currentTime - (ctx.outputLatency || 0) : 0),
    };
  })();

  /* ================= Ütemező: metronóm + bemutató lejátszás ================= */
  const Player = (() => {
    const LOOKAHEAD = 0.12;
    let running = false, timer = 0, raf = 0;
    let anchorTime = 0, anchorBeat = 0, spb = 1, nextBeat = 0;
    let demo = null;
    let visualQueue = [];
    let handlers = {};

    const timeAt = (b) => anchorTime + (b - anchorBeat) * spb;
    const beatAt = (t) => anchorBeat + (t - anchorTime) / spb;

    function setTempo(bpm) {
      if (running) {
        const now = Sound.now();
        anchorBeat = beatAt(now);
        anchorTime = now;
      }
      spb = 60 / bpm;
    }

    function start(startAt, demoState = null) {
      stop();
      demo = demoState;
      anchorTime = startAt;
      anchorBeat = 0;
      nextBeat = 0;
      running = true;
      timer = setInterval(tick, 25);
      tick();
      raf = requestAnimationFrame(frame);
    }

    function stop() {
      running = false;
      clearInterval(timer);
      cancelAnimationFrame(raf);
      cancelDemoVoices();
      demo = null;
      visualQueue = [];
    }

    function cancelDemoVoices() {
      if (!demo) return;
      const now = Sound.now();
      demo.voices.forEach((v) => { if (v && v.start > now) v.cancel(); });
    }

    function tick() {
      if (!running || !Sound.ctx) return;
      const horizon = Sound.now() + LOOKAHEAD;
      while (timeAt(nextBeat) < horizon) {
        scheduleBeat(nextBeat);
        nextBeat++;
      }
      if (demo) scheduleDemo(horizon);
      visualQueue.sort((a, b) => a.t - b.t);
    }

    function scheduleBeat(b) {
      const t = timeAt(b);
      const countIn = demo && b < demo.countIn;
      const tlBeat = demo ? b - demo.countIn + demo.barStart : b;
      const bpb = handlers.beatsPerBar();
      const beatInBar = ((Math.round(tlBeat) % bpb) + bpb) % bpb;
      if (settings.metronome || countIn) Sound.click(t, beatInBar === 0, settings.volume);
      visualQueue.push({ t, type: "beat", beatInBar, countIn: countIn ? b + 1 : 0 });
    }

    function scheduleDemo(horizon) {
      for (;;) {
        if (demo.ptr >= demo.steps.length) {
          if (!demo.loop) {
            if (!demo.endQueued) {
              visualQueue.push({ t: timeAt(demo.countIn + demo.totalBeats - demo.barStart), type: "demoEnd" });
              demo.endQueued = true;
            }
            return;
          }
          demo.cycle++;
          demo.ptr = 0;
          demo.voices = demo.voices.filter((v) => v && v.start > Sound.now());
        }
        const step = demo.steps[demo.ptr];
        const b = demo.countIn + step.start + demo.cycle * demo.totalBeats - demo.barStart;
        const t = timeAt(b);
        if (t >= horizon) return;
        if (step.index >= demo.fromIndex || demo.cycle > 0) {
          for (const n of step.notes) {
            const vel = n.accent ? 0.95 : n.hand === "left" ? 0.6 : 0.72;
            demo.voices.push(Sound.note(n.midi, t, n.dur * spb, vel));
          }
          visualQueue.push({ t, type: "step", index: step.index });
        }
        demo.ptr++;
      }
    }

    function frame() {
      if (!running) return;
      const heard = Sound.heardTime();
      while (visualQueue.length && visualQueue[0].t <= heard) {
        const ev = visualQueue.shift();
        if (ev.type === "beat") handlers.onBeat(ev.beatInBar, ev.countIn);
        else if (ev.type === "step") handlers.onDemoStep(ev.index);
        else if (ev.type === "demoEnd") { demo = null; handlers.onDemoEnd(); }
      }
      raf = requestAnimationFrame(frame);
    }

    return {
      init(h) { handlers = h; },
      setTempo,
      get running() { return running; },
      get demoActive() { return !!demo; },
      /** Bemutató a megadott lépés ütemének elejétől, opcionális 1 ütemes visszaszámlálással. */
      startDemo({ timeline, fromIndex, countIn }) {
        if (!Sound.ensure()) return;
        const bar = timeline.bars[timeline.steps[fromIndex].bar];
        start(Sound.now() + 0.08, {
          steps: timeline.steps, ptr: bar.steps[0], fromIndex: bar.steps[0],
          barStart: bar.start, countIn: countIn ? timeline.bpb : 0, totalBeats: timeline.totalBeats,
          loop: timeline.loop, cycle: 0, voices: [], endQueued: false,
        });
      },
      stopDemo() {
        cancelDemoVoices();
        demo = null;
        visualQueue = visualQueue.filter((e) => e.type === "beat" && !e.countIn);
        if (!settings.metronome) stop();
      },
      startMetronome() { if (!running && Sound.ensure()) start(Sound.now() + 0.05); },
      stopIfIdle() { if (!demo) stop(); },
      stop,
    };
  })();

  /* ================= Állapot ================= */
  const state = {
    screen: "home",
    song: null,
    mode: null,
    arpeggio: false,
    timeline: null,
    range: { low: 48, high: 71 },
    session: sessionInit(0),
    demoStep: -1,
    countIn: 0,
    beat: -1,
    feedback: null,
    lastInteraction: 0,
  };

  const $ = (sel) => document.querySelector(sel);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const validSongs = SONGS.filter((song) => {
    const errors = validateSong(song);
    errors.forEach((e) => console.error("[dal]", e));
    return errors.length === 0;
  }).sort((a, b) => a.level - b.level);
  const mainSongs = validSongs.filter((s) => !s.kids);
  const kidSongs = validSongs.filter((s) => s.kids);
  const barTotals = Object.fromEntries(mainSongs.map((s) => [s.id, songBarCount(s)]));

  const viewStepIndex = () => (Player.demoActive && state.demoStep >= 0 ? state.demoStep : state.session.stepIndex);
  const currentStep = () => state.timeline && state.timeline.steps[viewStepIndex()];

  /* ================= Téma ================= */
  function applyTheme() {
    if (settings.theme === "auto") delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = settings.theme;
  }

  /* ================= Kezdőlap ================= */
  function renderHome() {
    const minutes = Math.floor(PracticeLog.secondsToday() / 60);
    const ratio = Math.min(1, minutes / DAILY_GOAL_MIN);
    const C = 2 * Math.PI * 26;
    const msg = minutes >= DAILY_GOAL_MIN ? "Megvan a mai adag. Szép!" : minutes > 0 ? "Jó úton vagy, folytasd!" : "Kezdd egy rövid körrel.";
    $("#todayCard").innerHTML = `
      <svg class="ring" viewBox="0 0 64 64" aria-hidden="true">
        <circle class="bg" cx="32" cy="32" r="26" fill="none" stroke-width="7"/>
        <circle class="fg" cx="32" cy="32" r="26" fill="none" stroke-width="7" stroke-linecap="round"
          stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - ratio)}" transform="rotate(-90 32 32)"/>
        <text x="32" y="37" text-anchor="middle">${minutes}′</text>
      </svg>
      <div>
        <h2>Mai gyakorlás</h2>
        <p>${minutes} / ${DAILY_GOAL_MIN} perc · cél: napi 10–15 perc</p>
        <p>${msg}</p>
      </div>`;

    $("#songList").innerHTML = mainSongs.map((song, i) => {
      const done = Progress.bars(song.id).length;
      const total = barTotals[song.id];
      const pct = Math.round((done / total) * 100);
      const modes = availableModes(song).map((m) => MODE_LABELS[m].toLowerCase()).join(", ");
      return `
        <article class="card song-card">
          <div class="head">
            <div class="badge" aria-hidden="true">${i + 1}</div>
            <div style="flex:1;min-width:0">
              <h2>${esc(song.title)}</h2>
              <p class="meta">${esc(song.composer)} · ${song.meter[0]}/${song.meter[1]} · ${esc(song.summary)}</p>
              <p class="meta">Mód: ${esc(modes)}</p>
            </div>
          </div>
          ${song.copyrightNote ? `<p class="note">${esc(song.copyrightNote)}</p>` : ""}
          <div class="progress" role="progressbar" aria-label="Haladás" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${done}"><span style="width:${pct}%"></span></div>
          <div class="foot">
            <span>${done} / ${total} ütem hibátlan</span>
            <button class="btn primary" data-open="${esc(song.id)}">${done > 0 ? "Folytatás" : "Kezdés"}</button>
          </div>
        </article>`;
    }).join("");
    renderKidsList();
  }

  function showScreen(name) {
    state.screen = name;
    $("#toast").classList.add("hide");
    for (const id of ["home", "practice", "kids"]) $("#" + id).hidden = id !== name;
    Player.stop();
    state.demoStep = -1;
    kids.demoStep = -1;
    if (name === "home") {
      renderHome();
    } else if (name === "kids") {
      settings.metronome = false;
      Player.setTempo(KIDS_TEMPO);
      renderKidsKeyboard();
      renderKids(false);
    } else {
      Player.setTempo(settings.tempo);
      renderKeyboard();
      renderPractice();
    }
  }

  /* ================= Dal / mód / kéz ================= */
  function openSong(id) {
    const song = mainSongs.find((s) => s.id === id) || mainSongs[0];
    const prefs = Store.get("songPrefs", {})[song.id] || {};
    state.song = song;
    const modes = availableModes(song);
    state.mode = modes.includes(prefs.mode) ? prefs.mode : modes[0];
    state.arpeggio = !!prefs.arpeggio && hasArpeggio(song, state.mode);
    state.range = keyboardRange(song);
    rebuild(0);
    if (state.screen !== "practice") showScreen("practice");
    else { renderKeyboard(); renderPractice(); }
  }

  function saveSongPrefs() {
    const all = Store.get("songPrefs", {});
    all[state.song.id] = { mode: state.mode, arpeggio: state.arpeggio };
    Store.set("songPrefs", all);
  }

  /** Új idővonal (mód/kéz/felbontás váltásakor) — a megadott ütem elejétől folytatja. */
  function rebuild(targetBar) {
    if (Player.demoActive) Player.stopDemo();
    state.demoStep = -1;
    state.countIn = 0;
    state.timeline = buildTimeline(state.song, { mode: state.mode, hands: settings.hands, arpeggio: state.arpeggio });
    const steps = state.timeline.steps;
    const idx = Math.max(0, steps.findIndex((s) => s.bar >= targetBar));
    state.session = sessionInit(idx === -1 ? 0 : idx);
  }

  const currentBar = () => {
    const s = currentStep();
    return s ? s.bar : 0;
  };

  /* ================= Billentyűzet ================= */
  let keyEls = new Map();

  function renderKeyboard() {
    const { low, high } = state.range;
    const whites = [];
    for (let m = low; m <= high; m++) if (!isBlack(m)) whites.push(m);
    const w = 100 / whites.length;
    const bw = w * 0.62;
    let html = "";
    whites.forEach((m, i) => {
      html += `<button class="key w" data-midi="${m}" style="left:${i * w}%;width:${w}%" aria-label="${keyName(m)}${m === 60 ? ", középső C" : ""}">
        ${m === 60 ? '<span class="mc" aria-hidden="true"></span>' : ""}<span class="kf" aria-hidden="true"></span><span class="kl">${keyName(m)}</span></button>`;
    });
    for (let m = low; m <= high; m++) {
      if (!isBlack(m)) continue;
      const left = (whites.indexOf(m - 1) + 1) * w - bw / 2;
      html += `<button class="key b" data-midi="${m}" style="left:${left}%;width:${bw}%" aria-label="${keyName(m)}">
        <span class="kf" aria-hidden="true"></span><span class="kl">${keyName(m)}</span></button>`;
    }
    const keys = $("#keys");
    keys.innerHTML = html;
    keyEls = new Map([...keys.querySelectorAll(".key")].map((el) => [Number(el.dataset.midi), el]));
    keys.classList.toggle("no-labels", !settings.keyLabels);
  }

  function renderKeyHighlights() {
    const step = currentStep();
    const targets = new Map();
    if (step && !(state.session.finished && !Player.demoActive)) {
      for (const n of step.notes) if (!targets.has(n.midi)) targets.set(n.midi, n);
    }
    const satisfied = Player.demoActive ? [] : state.session.satisfied;
    keyEls.forEach((el, midi) => {
      const n = targets.get(midi);
      const done = !!n && satisfied.includes(midi);
      el.classList.toggle("tgt-r", !!n && !done && n.hand === "right");
      el.classList.toggle("tgt-l", !!n && !done && n.hand === "left");
      el.classList.toggle("done", done);
      const f = el.querySelector(".kf");
      f.textContent = n && n.finger != null ? n.finger : "";
      f.style.visibility = n && n.finger != null ? "visible" : "hidden";
      const label = el.querySelector(".kl");
      label.textContent = n ? n.name : keyName(midi);
    });
  }

  function flashKey(midi, kind) {
    const el = keyEls.get(midi);
    if (!el) return;
    const cls = kind === "ok" ? "flash-ok" : "flash-bad";
    el.classList.remove("flash-ok", "flash-bad");
    void el.offsetWidth;
    el.classList.add(cls);
    clearTimeout(el._flashTimer);
    el._flashTimer = setTimeout(() => el.classList.remove(cls), kind === "ok" ? 260 : 420);
  }

  function setupKeyInput(keys, onPress) {
    const release = (e) => {
      const el = e.target.closest && e.target.closest(".key");
      if (el) el.classList.remove("down");
    };
    keys.addEventListener("pointerdown", (e) => {
      const el = e.target.closest(".key");
      if (!el) return;
      e.preventDefault();
      el.classList.add("down");
      onPress(Number(el.dataset.midi));
    });
    keys.addEventListener("pointerup", release);
    keys.addEventListener("pointercancel", release);
    keys.addEventListener("pointerout", release);
    keys.addEventListener("contextmenu", (e) => e.preventDefault());
    keys.addEventListener("keydown", (e) => {
      if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("key")) {
        e.preventDefault();
        onPress(Number(e.target.dataset.midi));
      }
    });
  }

  function setupComputerKeyboard() {
    // Számítógépes billentyűzet (fizikai helyzet szerint, QWERTZ-en is): alsó sor = C3–H3, felső sor = C4–H4.
    const LOWER = ["KeyZ", "KeyS", "KeyX", "KeyD", "KeyC", "KeyV", "KeyG", "KeyB", "KeyH", "KeyN", "KeyJ", "KeyM"];
    const UPPER = ["KeyQ", "Digit2", "KeyW", "Digit3", "KeyE", "KeyR", "Digit5", "KeyT", "Digit6", "KeyY", "Digit7", "KeyU"];
    document.addEventListener("keydown", (e) => {
      if (state.screen === "home" || e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
      if ($("#overlay").hidden === false || /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
      let midi = null;
      if (LOWER.includes(e.code)) midi = 48 + LOWER.indexOf(e.code);
      else if (UPPER.includes(e.code)) midi = 60 + UPPER.indexOf(e.code);
      if (midi == null) return;
      e.preventDefault();
      if (state.screen === "kids") kidsPress(midi);
      else pressKey(midi);
    });
  }

  /* ================= Gyakorlás ================= */
  function pressKey(midi) {
    Sound.note(midi, null, null, 0.8);
    state.lastInteraction = Date.now();
    if (Player.demoActive || !state.timeline || state.session.finished) return;
    dispatch({ type: "key", midi });
  }

  function dispatch(action) {
    const { session, effects } = sessionReduce(state.session, action, state.timeline, { autoAdvance: settings.practice });
    state.session = session;
    for (const fx of effects) {
      if (fx.type === "ok") flashKey(fx.midi, "ok");
      else if (fx.type === "wrong") {
        flashKey(fx.midi, "bad");
        showFeedback(`Ez most ${keyName(fx.midi)} volt – a kivilágított billentyű jön.`, "bad");
      } else if (fx.type === "stepDone") {
        showFeedback(settings.practice ? "Szép!" : "Szép! Mehet a Következő gomb.", "ok");
      } else if (fx.type === "barClean") {
        Progress.add(state.song.id, fx.bar);
        if (!session.finished) showToast("Szép! Jöhet a következő ütem.");
      } else if (fx.type === "finished") {
        setTimeout(showSuccess, 350);
      }
    }
    renderPractice();
  }

  let feedbackTimer = 0;
  function showFeedback(text, kind) {
    state.feedback = { text, kind };
    clearTimeout(feedbackTimer);
    feedbackTimer = setTimeout(() => { state.feedback = null; renderNow(); }, 1800);
    renderNow();
  }

  let toastTimer = 0;
  function showToast(text) {
    const t = $("#toast");
    t.textContent = text;
    t.classList.remove("hide");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.add("hide"), 1500);
  }

  /* ================= Gyakorló képernyő renderelése ================= */
  function renderPractice() {
    if (state.screen !== "practice" || !state.timeline) return;
    renderHeader();
    renderControls();
    renderNow();
    renderKeyHighlights();
    renderScore();
  }

  function renderHeader() {
    const sel = $("#songSelect");
    if (sel.options.length !== mainSongs.length) {
      sel.innerHTML = mainSongs.map((s) => `<option value="${esc(s.id)}">${esc(s.title)}</option>`).join("");
    }
    sel.value = state.song.id;
    const modes = availableModes(state.song);
    $("#modeSeg").querySelectorAll("button").forEach((b) => {
      const m = b.dataset.mode;
      b.disabled = !modes.includes(m);
      b.title = b.disabled ? "Ehhez a dalhoz szerzői jogi okból nincs dallam" : "";
      b.setAttribute("aria-checked", String(m === state.mode));
    });
    const arp = $("#arpBtn");
    arp.hidden = !hasArpeggio(state.song, state.mode);
    arp.setAttribute("aria-pressed", String(state.arpeggio));
  }

  function renderControls() {
    $("#handSeg").querySelectorAll("button").forEach((b) => b.setAttribute("aria-checked", String(b.dataset.hands === settings.hands)));
    $("#practiceBtn").setAttribute("aria-pressed", String(settings.practice));
    $("#metroBtn").setAttribute("aria-pressed", String(settings.metronome));
    $("#tempo").value = settings.tempo;
    $("#tempoVal").textContent = settings.tempo;
    const playing = Player.demoActive;
    $("#playLabel").textContent = playing ? "Szünet" : "Lejátszás";
    $("#playBtn").setAttribute("aria-label", playing ? "Szünet" : "Lejátszás (bemutató)");
    $("#playIcon").innerHTML = playing
      ? '<rect x="6.5" y="5" width="4" height="14" rx="1"/><rect x="13.5" y="5" width="4" height="14" rx="1"/>'
      : '<path d="M8 5.5v13l10.5-6.5z"/>';
    const bpb = state.timeline.bpb;
    const dots = $("#beatDots");
    if (dots.children.length !== bpb) dots.innerHTML = Array.from({ length: bpb }, (_, i) => `<i class="${i === 0 ? "first" : ""}"></i>`).join("");
    dots.hidden = !Player.running;
  }

  function describeHand(step, hand) {
    const notes = step.notes.filter((n) => n.hand === hand);
    if (!notes.length) return null;
    const cls = hand === "right" ? "hand-r" : "hand-l";
    if (notes.length > 1 && step.chord) return { html: `<span class="${cls}">${esc(step.chord.name)}</span>`, notes };
    const n = notes[0];
    return { html: `<span class="${cls}">${esc(n.name)}${n.finger != null ? `<sup>${n.finger}</sup>` : ""}</span>`, notes };
  }

  function renderNow() {
    const main = $("#nowMain"), sub = $("#nowSub");
    sub.className = "now-sub";
    const step = currentStep();
    if (state.countIn) {
      main.textContent = `${state.countIn}…`;
      sub.textContent = "Figyelj, mindjárt indul.";
      return;
    }
    if (!step) { main.textContent = ""; sub.textContent = ""; return; }
    if (state.session.finished && !Player.demoActive) {
      main.textContent = "Kész!";
      sub.textContent = "Nyomd meg az Újra gombot egy új körhöz.";
      return;
    }
    const parts = ["right", "left"].map((h) => describeHand(step, h)).filter(Boolean);
    main.innerHTML = parts.map((p) => p.html).join('<span class="sep">·</span>');
    if (state.feedback) {
      sub.textContent = state.feedback.text;
      sub.classList.add(state.feedback.kind);
      return;
    }
    if (Player.demoActive) { sub.textContent = "Hallgasd meg, és figyeld a kivilágítást."; return; }
    const chordPart = parts.find((p) => p.notes.length > 1);
    if (chordPart) {
      const ns = chordPart.notes.slice().sort((a, b) => a.midi - b.midi);
      sub.textContent = `${ns.map((n) => n.name).join("–")} · ujjak: ${ns.map((n) => n.finger ?? "–").join("–")}`;
    } else if (parts.length === 2) {
      sub.textContent = "Kék: jobb kéz · narancs: bal kéz";
    } else {
      const n = parts[0].notes[0];
      sub.textContent = `${HAND_LABELS[n.hand]}${n.finger != null ? ` · ${n.finger}. ujj` : ""} — keresd a ${n.hand === "right" ? "kék" : "narancs"} billentyűt`;
    }
  }

  function onBeat(beatInBar, countIn) {
    state.beat = beatInBar;
    const prevCount = state.countIn;
    state.countIn = countIn;
    document.querySelectorAll("#beatDots, #metroBeats").forEach((dots) => {
      [...dots.children].forEach((el, i) => el.classList.toggle("on", i === beatInBar));
    });
    if (countIn || prevCount) { renderNow(); renderKeyHighlights(); }
  }

  function onDemoStep(index) {
    state.demoStep = index;
    state.countIn = 0;
    const step = state.timeline.steps[index];
    step.notes.forEach((n) => {
      const el = keyEls.get(n.midi);
      if (!el) return;
      el.classList.add("down");
      setTimeout(() => el.classList.remove("down"), 140);
    });
    renderNow();
    renderKeyHighlights();
    renderScore();
  }

  function onDemoEnd() {
    state.demoStep = -1;
    state.countIn = 0;
    state.session = sessionInit(0);
    if (!settings.metronome) Player.stop();
    showToast("Most te jössz!");
    renderPractice();
  }

  /* ================= Kotta (SVG) ================= */
  const LS = 10;                      // vonalköz
  const CLEF_W = 52;
  const TREBLE_BOTTOM = 30;           // E4 diatonikus száma (alsó vonal)
  const BASS_BOTTOM = 18;             // G2 diatonikus száma (alsó vonal)
  const LABEL_LH = 13;

  const TREBLE_CLEF = "M13.5 31 C9.5 31 9.5 25 13.5 24.2 C19.5 23.4 21.5 31.5 15.5 35.2 C8.5 39.2 2.6 31 7 24 C11 17.5 19.5 10.5 18.8 -1 C18.4 -8.5 13 -8.5 12.2 -1.5 C11.4 6 14.2 30 15.2 48 C15.6 54.5 9.5 55.5 8.5 50.5";
  const BASS_CLEF = "M5.5 11 C4 2.5 22 0 22.5 12 C23 24 13 32 3.5 38.5";

  function staffY(diatonic, bottomDiatonic) { return 40 - (diatonic - bottomDiatonic) * (LS / 2); }

  function labelWidth(note) { return note.name.length * 6.6 + (note.finger != null ? 6 : 0); }

  function renderScore() {
    const wrap = $("#scoreWrap"), svg = $("#score");
    const cw = wrap.clientWidth, ch = wrap.clientHeight;
    const tl = state.timeline;
    if (!cw || !ch || !tl || !tl.steps.length) { svg.innerHTML = ""; return; }

    const hands = settings.hands;
    const showT = hands !== "left", showB = hands !== "right";
    const curIndex = viewStepIndex();
    const curStep = tl.steps[curIndex];
    const curBar = curStep.bar;
    const isCur = (s) => s.index === curIndex && !(state.session.finished && !Player.demoActive);

    // --- függőleges elrendezés (a teljes dalra számolva, hogy ne ugráljon) ---
    const linesPer = { right: 1, left: 1 };
    let lowRight = 40, highLeft = 0;
    for (const s of tl.steps) {
      for (const hand of ["right", "left"]) {
        const ns = s.notes.filter((n) => n.hand === hand);
        linesPer[hand] = Math.max(linesPer[hand], ns.length);
      }
      for (const n of s.notes) {
        if (n.hand === "right") lowRight = Math.max(lowRight, staffY(n.pitch.diatonic, TREBLE_BOTTOM));
        else highLeft = Math.min(highLeft, staffY(n.pitch.diatonic, BASS_BOTTOM));
      }
    }
    const hasTopRow = tl.chordSlots.length > 0;
    let y = 4;
    const chordY = y + 12;
    if (hasTopRow) y += 18;
    let TT = null, tLab = null, BT = null, bLab = null;
    if (showT) {
      TT = y + 26;
      tLab = TT + Math.max(54, lowRight + 18);
      y = tLab + (linesPer.right - 1) * LABEL_LH + 6;
    }
    if (showB) {
      BT = y + Math.max(20, 14 - highLeft);
      bLab = BT + 56;
      y = bLab + (linesPer.left - 1) * LABEL_LH + 6;
    }
    const H = y + 2;

    // --- vízszintes elrendezés: aktuális ütem + 1–2 következő ---
    const s0 = Math.min(1.6, Math.max(0.55, ch / H));
    const avail = cw / s0 - CLEF_W - 8;
    const slotWidth = (s) => {
      const minW = Math.max(24, ...s.notes.map(labelWidth)) + 6;
      return Math.max(minW, s.dur * 30);
    };
    const barNatural = (b) => 18 + tl.bars[b].steps.reduce((sum, i) => sum + slotWidth(tl.steps[i]), 0);
    // Az aktuális ütem mellett a következő is látsszon, ha így is olvasható marad (≥ 0,85 px/egység);
    // harmadik ütem csak akkor, ha kicsinyítés nélkül is elfér (pl. fekvő mód).
    const MIN_SCALE = 0.85;
    let n = 1, natural = barNatural(curBar);
    if (curBar + 1 < tl.barCount) {
      const two = natural + barNatural(curBar + 1);
      if (cw / (CLEF_W + two + 8) >= MIN_SCALE) { natural = two; n = 2; }
    }
    if (n === 2 && curBar + 2 < tl.barCount && natural + barNatural(curBar + 2) <= avail) {
      natural += barNatural(curBar + 2);
      n = 3;
    }
    const nextSlot = n === 1 && curBar + 1 < tl.barCount ? tl.chordSlots.find((c) => c.bar === curBar + 1) : null;
    const hintW = nextSlot ? nextSlot.name.length * 6.5 + 26 : 0;
    const stretch = Math.min(3.5, Math.max(1, (avail - hintW) / natural));
    const W = Math.max(CLEF_W + natural * stretch + hintW + 8, cw / s0);
    const H2 = Math.max(H, ch / s0);
    const yOff = (H2 - H) / 2;

    const out = [];
    const staves = [];
    if (showT) staves.push({ hand: "right", top: TT, bottom: TREBLE_BOTTOM, labelY: tLab });
    if (showB) staves.push({ hand: "left", top: BT, bottom: BASS_BOTTOM, labelY: bLab });
    const sysTop = staves[0].top, sysBottom = staves[staves.length - 1].top + 40;

    // kulcsok, ütemmutató (a vonalak a végén, amikor már ismert a rendszer hossza)
    for (const st of staves) {
      if (st.hand === "right") {
        out.push(`<g transform="translate(5 ${st.top})"><path class="sc-clef" d="${TREBLE_CLEF}"/><circle class="sc-clef-dot" cx="10" cy="50.5" r="2.6"/></g>`);
      } else {
        out.push(`<g transform="translate(6 ${st.top})"><path class="sc-clef" d="${BASS_CLEF}" stroke-width="2.6"/><circle class="sc-clef-dot" cx="6.5" cy="10.5" r="3.4"/><circle class="sc-clef-dot" cx="27" cy="5" r="1.8"/><circle class="sc-clef-dot" cx="27" cy="15" r="1.8"/></g>`);
      }
      out.push(`<text class="sc-ts" x="${CLEF_W - 10}" y="${st.top + 17}" text-anchor="middle">${tl.meter[0]}</text>`);
      out.push(`<text class="sc-ts" x="${CLEF_W - 10}" y="${st.top + 37}" text-anchor="middle">${tl.meter[1]}</text>`);
    }
    out.push(`<line class="sc-bar" x1="4" x2="4" y1="${sysTop}" y2="${sysBottom}"/>`);

    // ütemek és hangok
    const bands = [];
    let x = CLEF_W;
    for (let b = curBar; b < curBar + n; b++) {
      const bar = tl.bars[b];
      out.push(`<text class="sc-barno" x="${x + 4}" y="${sysTop - 6}">${b + 1}</text>`);
      let sx = x + 12 * stretch;
      for (const si of bar.steps) {
        const step = tl.steps[si];
        const w = slotWidth(step) * stretch;
        const nx = sx + 12;
        const cur = isCur(step);
        if (cur) {
          const handsHere = new Set(step.notes.map((nn) => nn.hand));
          const kind = handsHere.size > 1 ? "both" : [...handsHere][0];
          bands.push(`<rect class="sc-band sc-band-${kind}" x="${nx - 13}" y="${sysTop - 14}" width="26" height="${sysBottom - sysTop + 28}" rx="8"/>`);
        }
        if (step.chord && Math.abs(step.chord.start - step.start) < 1e-6 && hasTopRow) {
          const curChord = currentStep() && currentStep().chord === step.chord;
          out.push(`<text class="sc-chord${curChord ? " cur" : ""}" x="${nx - 6}" y="${chordY}">${esc(step.chord.name)}</text>`);
        }
        for (const st of staves) {
          const notes = step.notes.filter((nn) => nn.hand === st.hand);
          if (notes.length) out.push(drawNotes(notes, nx, st, step, cur));
        }
        if (step.accent && showT) out.push(`<path d="M${nx - 5} ${TT - 16} L${nx + 5} ${TT - 13} L${nx - 5} ${TT - 10}" fill="none" stroke="currentColor" stroke-width="1.4" class="${cur ? "n-cur-right" : "n-fut"}"/>`);
        sx += w;
      }
      x = sx + 6 * stretch;
      const last = b === tl.barCount - 1;
      out.push(`<line class="sc-bar" x1="${x}" x2="${x}" y1="${sysTop}" y2="${sysBottom}"/>`);
      if (last) out.push(`<line class="sc-bar" x1="${x + 4}" x2="${x + 4}" y1="${sysTop}" y2="${sysBottom}" stroke-width="3.5"/>`);
    }
    const staffEnd = x + (tl.bars[curBar + n - 1].index === tl.barCount - 1 ? 6 : 0);
    for (const st of staves) {
      for (let i = 0; i < 5; i++) out.unshift(`<line class="sc-line" x1="4" x2="${staffEnd}" y1="${st.top + i * LS}" y2="${st.top + i * LS}"/>`);
    }
    if (nextSlot) out.push(`<text class="sc-next" x="${x + 10}" y="${sysTop + 4}">→ ${esc(nextSlot.name)}</text>`);

    svg.setAttribute("viewBox", `0 ${-yOff} ${W} ${H2}`);
    svg.setAttribute("preserveAspectRatio", "xMinYMid meet");
    svg.innerHTML = bands.join("") + out.join("");
    const desc = currentStep() ? currentStep().notes.map((nn) => nn.name).join(", ") : "";
    svg.setAttribute("aria-label", `Kotta, ${curBar + 1}. ütem. Következő: ${desc}`);
  }

  function drawNotes(notes, x, staff, step, cur) {
    const satisfied = Player.demoActive ? [] : state.session.satisfied;
    const idx = viewStepIndex();
    const sorted = notes.slice().sort((a, b) => b.pitch.diatonic - a.pitch.diatonic);
    const dur = sorted[0].dur;
    const parts = [];
    const ys = sorted.map((n) => staff.top + staffY(n.pitch.diatonic, staff.bottom));
    const colorOf = (n) => {
      if (state.session.finished && !Player.demoActive) return "n-past";
      if (cur) return satisfied.includes(n.midi) ? "n-done" : `n-cur-${n.hand}`;
      return step.index < idx ? "n-past" : "n-fut";
    };
    const groupCls = colorOf(sorted[0]);
    const r = cur ? 1.12 : 1;

    sorted.forEach((n, i) => {
      const ny = ys[i];
      const cls = colorOf(n);
      const rel = ny - staff.top;
      // pótvonalak
      for (let ly = 50; ly <= rel + 0.1; ly += LS) parts.push(`<line class="${cls}" stroke="currentColor" stroke-width="1.2" x1="${x - 10}" x2="${x + 10}" y1="${staff.top + ly}" y2="${staff.top + ly}"/>`);
      for (let ly = -10; ly >= rel - 0.1; ly -= LS) parts.push(`<line class="${cls}" stroke="currentColor" stroke-width="1.2" x1="${x - 10}" x2="${x + 10}" y1="${staff.top + ly}" y2="${staff.top + ly}"/>`);
      const hollow = dur >= 2;
      parts.push(`<g class="${cls}"><ellipse cx="${x}" cy="${ny}" rx="${6 * r}" ry="${4.4 * r}" transform="rotate(-20 ${x} ${ny})" ${hollow ? 'fill="none" stroke="currentColor" stroke-width="1.8"' : 'fill="currentColor"'}/></g>`);
      if (n.pitch.alter) parts.push(`<text class="${cls}" fill="currentColor" x="${x - 17}" y="${ny + 5}" font-size="15">${n.pitch.alter > 0 ? "♯" : "♭"}</text>`);
      if (dur === 1.5 || dur === 3 || dur === 0.75) {
        const dy = Math.abs(rel % LS) < 0.1 ? ny - 5 : ny;
        parts.push(`<circle class="${cls}" fill="currentColor" cx="${x + 10}" cy="${dy}" r="1.8"/>`);
      }
    });

    if (dur < 4) {
      const top = ys[0], bottom = ys[ys.length - 1];
      const mid = staff.top + 20;
      const up = (top + bottom) / 2 >= mid;
      const sx = up ? x + 5.6 : x - 5.6;
      const y1 = up ? bottom : top;
      const y2 = up ? top - 32 : bottom + 32;
      parts.push(`<line class="${groupCls}" stroke="currentColor" stroke-width="1.4" x1="${sx}" x2="${sx}" y1="${y1}" y2="${y2}"/>`);
      if (dur <= 0.75) {
        const d = up ? `M${sx} ${y2} q 9 7 6 17` : `M${sx} ${y2} q 9 -7 6 -17`;
        parts.push(`<path class="${groupCls}" d="${d}" fill="none" stroke="currentColor" stroke-width="1.7"/>`);
      }
    }

    // címkék: hangnév + ujjszám (felülről lefelé)
    sorted.forEach((n, i) => {
      const cls = colorOf(n);
      parts.push(`<text class="sc-label ${cls}" fill="currentColor" x="${x}" y="${staff.labelY + i * LABEL_LH}" text-anchor="middle">${esc(n.name)}${n.finger != null ? `<tspan class="f" dx="1" dy="-4.5">${n.finger}</tspan>` : ""}</text>`);
    });
    return parts.join("");
  }

  /* ================= Lapok (súgó, metronóm, siker, bevezető) ================= */
  let sheetCloseHandler = null;
  function openSheet(html, { onClose, label } = {}) {
    const overlay = $("#overlay");
    overlay.innerHTML = `<div class="backdrop" data-close></div>
      <div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(label || "")}"><div class="grab" aria-hidden="true"></div>${html}</div>`;
    overlay.hidden = false;
    $("#toast").classList.add("hide");
    sheetCloseHandler = onClose || null;
    const first = overlay.querySelector(".sheet button, .sheet input");
    if (first) first.focus({ preventScroll: true });
    return overlay.querySelector(".sheet");
  }
  function closeSheet() {
    const overlay = $("#overlay");
    if (overlay.hidden) return;
    overlay.hidden = true;
    overlay.innerHTML = "";
    const h = sheetCloseHandler;
    sheetCloseHandler = null;
    if (h) h();
  }

  function miniKeyboard(marks) {
    // 1 oktáv + C: fehérek C..C, feketék a szokásos helyen; marks: {C:'r', F:'l'}
    const whites = ["C", "D", "E", "F", "G", "A", "H", "C"];
    const kw = 38, h = 110;
    let s = `<svg class="mini-kb" viewBox="0 0 ${whites.length * kw + 2} ${h + 2}" aria-hidden="true">`;
    whites.forEach((name, i) => {
      const fill = marks[name] && (i < 7 || name === "C") ? (marks[name] === "r" ? "var(--rh)" : "var(--lh)") : "var(--white-key)";
      const ink = fill === "var(--white-key)" ? "#3a3f4b" : "#fff";
      s += `<rect x="${1 + i * kw}" y="1" width="${kw - 2}" height="${h}" rx="4" fill="${fill}" stroke="var(--white-key-edge)"/>`;
      s += `<text x="${1 + i * kw + kw / 2 - 1}" y="${h - 10}" text-anchor="middle" font-size="15" font-weight="700" fill="${ink}">${name}</text>`;
    });
    [1, 2, 4, 5, 6].forEach((i) => {
      s += `<rect x="${1 + i * kw - 12}" y="1" width="22" height="${h * 0.6}" rx="3" fill="var(--black-key)"/>`;
    });
    return s + "</svg>";
  }

  function openMetronome() {
    const bpb = state.timeline ? state.timeline.bpb : 4;
    const meter = state.timeline ? state.timeline.meter : [4, 4];
    const sheet = openSheet(`
      <h2>Metronóm</h2>
      <div class="metro-bpm">
        <button class="btn" id="mMinus" aria-label="Lassabb (−5)">−</button>

      <div class="setting"><span>Hangerő</span><input type="range" id="mVol" min="0" max="1" step="0.05" value="${settings.volume}" style="max-width:200px" aria-label="Metronóm hangereje"></div>

    const sync = () => {
      sheet.querySelector("#mBpm").textContent = settings.tempo;
      sheet.querySelector("#mTempo").value = settings.tempo;
      renderControls();
    };
    sheet.querySelector("#mMinus").addEventListener("click", () => { setTempo(settings.tempo - 5); sync(); });
    sheet.querySelector("#mPlus").addEventListener("click", () => { setTempo(settings.tempo + 5); sync(); });
    sheet.querySelector("#mTempo").addEventListener("input", (e) => { setTempo(Number(e.target.value)); sync(); });
    sheet.querySelector("#mOn").addEventListener("click", (e) => {
      toggleMetronome();
      e.currentTarget.setAttribute("aria-pressed", String(settings.metronome));

    });
    sheet.querySelector("#mCount").addEventListener("click", (e) => {

      e.currentTarget.setAttribute("aria-pressed", String(settings.countIn));
      e.currentTarget.lastChild.textContent = settings.countIn ? "Be" : "Ki";
    });
    sheet.querySelector("#mVol").addEventListener("input", (e) => {
      settings.volume = Number(e.target.value);
      saveSettings();
    });
  }

  function showSuccess() {
    if (state.screen !== "practice") return;
    const tl = state.timeline;
    const total = tl.bars.filter((b) => b.steps.length).length;
    const clean = new Set(state.session.cleanBars).size;
    const songIndex = mainSongs.indexOf(state.song);
    const tip = suggestNext({
      cleanBars: clean, totalBars: total, hands: settings.hands, practice: settings.practice,
      tempo: settings.tempo, songIndex, songCount: mainSongs.length,
    });
    const perfect = clean === total;
    const sheet = openSheet(`
      <div class="success">
        <svg viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="30" fill="none" stroke-width="5"/><path d="M23 37l9 9 17-19" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <h2>${perfect ? "Hibátlan! Szép munka." : "Végigértél!"}</h2>
        <p class="stat">${clean} / ${total} ütem hibátlan</p>
        <p class="muted">${esc(state.song.title)} · ${MODE_LABELS[state.mode]} · ${HAND_LABELS[settings.hands]} · ${settings.tempo} BPM</p>
        <p>${esc(tip.text)}</p>
        <div class="actions">
          <button class="btn" id="sAgain">Még egyszer</button>
          ${tip.action && tip.action.kind !== "retry" ? `<button class="btn primary" id="sNext">${esc(tip.label)}</button>` : ""}
          <button class="btn" id="sHome">Kezdőlap</button>
        </div>
      </div>`, { label: "Eredmény" });
    sheet.querySelector("#sAgain").addEventListener("click", () => { closeSheet(); restart(); });
    sheet.querySelector("#sHome").addEventListener("click", () => { closeSheet(); showScreen("home"); });
    const next = sheet.querySelector("#sNext");
    if (next) next.addEventListener("click", () => { closeSheet(); applySuggestion(tip.action); });
  }

  function applySuggestion(action) {
    if (action.kind === "tempo") { setTempo(action.value); restart(); }
    else if (action.kind === "practice") { settings.practice = true; saveSettings(); restart(); }
    else if (action.kind === "hands") { setHands(action.value); }
    else if (action.kind === "song") { openSong(mainSongs[action.index].id); }
    else restart();
  }

        <button class="btn" id="obSkip">${last ? "Vissza" : "Kihagyom"}</button>
        <button class="btn primary" id="obNext">${last ? "Kezdjük!" : "Tovább"}</button>
      </div>`, { label: `Bevezető ${i + 1}/3`, onClose: () => Store.set("onboarded", true) });
    sheet.querySelector("#obNext").addEventListener("click", () => (last ? closeSheet() : openOnboarding(i + 1)));
    sheet.querySelector("#obSkip").addEventListener("click", () => (last ? openOnboarding(i - 1) : closeSheet()));
  }

  /* ================= Gyerekdalok ================= */
  const KIDS_TEMPO = 92;
  const LIGHT_INK_PCS = [4]; // sárga: sötét betű kell rá
  const pcOf = (midi) => ((midi % 12) + 12) % 12;
  const kidColor = (midi) => `var(--kc-${pcOf(midi)})`;
  const kids = { song: null, timeline: null, range: { low: 60, high: 72 }, session: sessionInit(0), demoStep: -1 };
  let kidKeyEls = new Map();

  const kidStars = {
    all: Store.get("kidStars", {}),
    get(id) { return this.all[id] || 0; },
    add(id) { this.all[id] = this.get(id) + 1; Store.set("kidStars", this.all); },
  };

  function renderKidsList() {
    $("#kidsSection").hidden = kidSongs.length === 0;
    $("#kidsList").innerHTML = kidSongs.map((song) => {
      const tl = buildTimeline(song, { mode: "melody", hands: "right" });
      const pcs = [...new Set(tl.events.map((e) => pcOf(e.midi)))].sort((a, b) => a - b);
      const stars = kidStars.get(song.id);
      return `
        <button class="kid-card" data-kids="${esc(song.id)}" aria-label="${esc(song.title)}, ${esc(song.summary)}">
          <span class="pic" aria-hidden="true">${esc(song.picture || "♪")}</span>
          <h3>${esc(song.title)}</h3>
          <p>${esc(song.summary)}</p>
          <span class="row">
            <span class="note-dots" aria-hidden="true">${pcs.map((m) => `<i style="--kc:${kidColor(m)}"></i>`).join("")}</span>
            <span class="kid-stars">${stars ? `★ ${stars}` : ""}</span>
          </span>
        </button>`;
    }).join("");
  }

  function openKids(id) {
    const song = kidSongs.find((s) => s.id === id);
    if (!song) return;
    kids.song = song;
    kids.timeline = buildTimeline(song, { mode: "melody", hands: "right" });
    kids.range = kidsRange(song);
    kids.session = sessionInit(0);
    $("#kidsDone").hidden = true;
    showScreen("kids");
  }

  const kidsViewIndex = () => (Player.demoActive && kids.demoStep >= 0 ? kids.demoStep : kids.session.stepIndex);

  function renderKidsKeyboard() {
    const { low, high } = kids.range;
    const whites = [];
    for (let m = low; m <= high; m++) if (!isBlack(m)) whites.push(m);
    const w = 100 / whites.length;
    const bw = w * 0.56;
    let html = "";
    whites.forEach((m, i) => {
      const ink = LIGHT_INK_PCS.includes(pcOf(m)) ? " light-ink" : "";
      html += `<button class="key w${ink}" data-midi="${m}" style="left:${i * w}%;width:${w}%;--kc:${kidColor(m)}" aria-label="${keyName(m)}"><span class="kl">${keyName(m)}</span></button>`;
    });
    for (let m = low; m <= high; m++) {
      if (!isBlack(m)) continue;
      const left = (whites.indexOf(m - 1) + 1) * w - bw / 2;
      html += `<button class="key b" data-midi="${m}" style="left:${left}%;width:${bw}%" aria-label="${keyName(m)}"></button>`;
    }
    const el = $("#kidsKeys");
    el.innerHTML = html;
    el.classList.toggle("no-labels", !settings.keyLabels);
    kidKeyEls = new Map([...el.querySelectorAll(".key")].map((k) => [Number(k.dataset.midi), k]));
  }

  function renderKids(advanced) {
    if (state.screen !== "kids" || !kids.timeline) return;
    const tl = kids.timeline;
    const idx = kidsViewIndex();
    const finished = kids.session.finished && !Player.demoActive;
    $("#kidsPic").textContent = kids.song.picture || "♪";
    $("#kidsTitle").textContent = kids.song.title;
    $("#kidsListen").setAttribute("aria-pressed", String(Player.demoActive));
    $("#kidsBar").style.width = `${((finished ? tl.steps.length : idx) / tl.steps.length) * 100}%`;

    const upcoming = finished ? [] : tl.steps.slice(idx, idx + 6);
    $("#bubbles").innerHTML = upcoming.map((step, i) => {
      const n = step.notes[0];
      const ink = LIGHT_INK_PCS.includes(pcOf(n.midi)) ? "light-ink" : "";
      const cls = i === 0 ? `bubble cur${advanced ? " pop" : ""}` : "bubble";
      return `<div class="${cls}" style="--kc:${kidColor(n.midi)}"${i === 0 ? ` aria-label="Következő: ${esc(n.name)}"` : ' aria-hidden="true"'}>
        <i class="${ink}">${settings.keyLabels ? esc(n.name) : ""}</i><b>${n.lyric ? esc(n.lyric) : ""}</b></div>`;
    }).join("");

    const target = finished ? null : tl.steps[idx];
    const targets = new Set(target ? target.notes.map((n) => n.midi) : []);
    kidKeyEls.forEach((el, midi) => el.classList.toggle("kt", targets.has(midi)));
  }

  function kidsSparkle(midi) {
    const el = kidKeyEls.get(midi);
    if (!el) return;
    const s = document.createElement("span");
    s.className = "spark";
    s.textContent = "★";
    s.setAttribute("aria-hidden", "true");
    el.appendChild(s);
    setTimeout(() => s.remove(), 750);
  }

  function kidsHint() {
    const step = kids.timeline.steps[kids.session.stepIndex];
    const els = step.notes.map((n) => kidKeyEls.get(n.midi)).concat([$("#bubbles .bubble.cur")]);
    els.forEach((el) => {
      if (!el) return;
      el.classList.remove("wiggle");
      void el.offsetWidth;
      el.classList.add("wiggle");
    });
  }

  function kidsPress(midi) {
    Sound.note(midi, null, null, 0.85);
    state.lastInteraction = Date.now();
    if (Player.demoActive || kids.session.finished || !kids.timeline) return;
    const before = kids.session.stepIndex;
    const { session, effects } = sessionReduce(kids.session, { type: "key", midi }, kids.timeline, { autoAdvance: true });
    kids.session = session;
    let hint = false;
    for (const fx of effects) {
      if (fx.type === "ok") kidsSparkle(fx.midi);
      else if (fx.type === "wrong") hint = true;
      else if (fx.type === "finished") setTimeout(kidsCelebrate, 450);
    }
    renderKids(session.stepIndex !== before);
    if (hint) kidsHint();
  }

  function kidsCelebrate() {
    if (state.screen !== "kids") return;
    kidStars.add(kids.song.id);
    const t = Sound.now() + 0.05;
    [72, 76, 79, 84].forEach((m, i) => Sound.note(m, t + i * 0.13, i === 3 ? 0.8 : 0.2, 0.7));
    $("#kidsDone").hidden = false;
    renderKids(false);
    $("#kidsAgain").focus({ preventScroll: true });
  }

  function kidsRestart() {
    if (Player.demoActive) Player.stop();
    kids.demoStep = -1;
    kids.session = sessionInit(0);
    $("#kidsDone").hidden = true;
    renderKids(true);
  }

  function kidsToggleListen() {
    Sound.ensure();
    state.lastInteraction = Date.now();
    if (Player.demoActive) {
      Player.stop();
      kids.demoStep = -1;
      renderKids(false);
      return;
    }
    $("#kidsDone").hidden = true;
    kids.session = sessionInit(0);
    kids.demoStep = 0;
    Player.setTempo(KIDS_TEMPO);
    Player.startDemo({ timeline: kids.timeline, fromIndex: 0, countIn: false });
    renderKids(true);
  }

  function kidsOnDemoStep(index) {
    kids.demoStep = index;
    kids.timeline.steps[index].notes.forEach((n) => {
      const el = kidKeyEls.get(n.midi);
      if (!el) return;
      el.classList.add("down");
      setTimeout(() => el.classList.remove("down"), 160);
    });
    renderKids(true);
  }

  function kidsOnDemoEnd() {
    Player.stop();
    kids.demoStep = -1;
    kids.session = sessionInit(0);
    renderKids(true);
  }

  /* ================= Műveletek ================= */
  function setTempo(v) {
    settings.tempo = Math.min(120, Math.max(40, Math.round(v)));
    saveSettings();
    Player.setTempo(settings.tempo);
  }

  function setHands(h) {
    const bar = currentBar();
    settings.hands = h;
    saveSettings();
    rebuild(bar);
    renderPractice();
  }

  function restart() {
    if (Player.demoActive) Player.stopDemo();
    state.demoStep = -1;
    state.countIn = 0;
    state.session = sessionInit(0);
    renderPractice();
  }

  function togglePlay() {
    Sound.ensure();
    state.lastInteraction = Date.now();
    if (Player.demoActive) {
      const idx = state.demoStep >= 0 ? state.demoStep : state.session.stepIndex;
      Player.stopDemo();
      state.demoStep = -1;
      state.countIn = 0;
      state.session = sessionInit(idx);
    } else {
      const from = state.session.finished ? 0 : state.session.stepIndex;
      const firstOfBar = state.timeline.bars[state.timeline.steps[from].bar].steps[0];
      state.session = sessionInit(firstOfBar);
      state.demoStep = firstOfBar;
      Player.startDemo({ timeline: state.timeline, fromIndex: firstOfBar, countIn: settings.countIn });
    }
    renderPractice();
  }

  function toggleMetronome() {
    Sound.ensure();
    settings.metronome = !settings.metronome;
    saveSettings();
    if (settings.metronome) Player.startMetronome();
    else Player.stopIfIdle();
    renderControls();
  }

  /* ================= Eseménykezelők ================= */
  function bindEvents() {
    document.addEventListener("click", (e) => {
      const open = e.target.closest("[data-open]");
      if (open) { Sound.ensure(); openSong(open.dataset.open); return; }
      const kidOpen = e.target.closest("[data-kids]");
      if (kidOpen) { Sound.ensure(); openKids(kidOpen.dataset.kids); return; }
      if (e.target.closest("[data-close]")) closeSheet();
    });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });

    $("#homeHelp").addEventListener("click", openHelp);
    $("#helpBtn").addEventListener("click", openHelp);
    $("#backBtn").addEventListener("click", () => showScreen("home"));
    $("#kidsBack").addEventListener("click", () => showScreen("home"));
    $("#kidsOther").addEventListener("click", () => showScreen("home"));
    $("#kidsListen").addEventListener("click", kidsToggleListen);
    $("#kidsRestart").addEventListener("click", kidsRestart);
    $("#kidsAgain").addEventListener("click", kidsRestart);
    $("#songSelect").addEventListener("change", (e) => openSong(e.target.value));
    $("#modeSeg").addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (!b || b.disabled || b.dataset.mode === state.mode) return;
      const bar = currentBar();
      state.mode = b.dataset.mode;
      state.arpeggio = state.arpeggio && hasArpeggio(state.song, state.mode);
      saveSongPrefs();
      rebuild(bar);
      renderPractice();
    });
    $("#arpBtn").addEventListener("click", () => {
      const bar = currentBar();
      state.arpeggio = !state.arpeggio;
      saveSongPrefs();
      rebuild(bar);
      renderPractice();
    });
    $("#handSeg").addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (b && b.dataset.hands !== settings.hands) setHands(b.dataset.hands);
    });
    $("#practiceBtn").addEventListener("click", () => {
      settings.practice = !settings.practice;
      saveSettings();
      showToast(settings.practice ? "Gyakorlás: megvárom, amíg leütöd." : "Lépésenként: a Következő gombbal haladsz.");
      if (settings.practice && state.session.stepDone && !state.session.finished) dispatch({ type: "next" });
      else renderControls();
    });
    $("#playBtn").addEventListener("click", togglePlay);
    $("#restartBtn").addEventListener("click", restart);
    $("#nextBtn").addEventListener("click", () => {
      Sound.ensure();
      state.lastInteraction = Date.now();
      if (Player.demoActive) togglePlay();
      if (state.session.finished) { restart(); return; }
      dispatch({ type: "next" });
      const step = currentStep();
      if (step && !state.session.finished) step.notes.forEach((n) => Sound.note(n.midi, null, 0.5, 0.45));
    });
    $("#metroBtn").addEventListener("click", toggleMetronome);
    $("#tempoBtn").addEventListener("click", openMetronome);
    $("#tempo").addEventListener("input", (e) => {
      setTempo(Number(e.target.value));
      $("#tempoVal").textContent = settings.tempo;
    });

    new ResizeObserver(() => { if (state.screen === "practice") renderScore(); }).observe($("#scoreWrap"));
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => { if (state.screen === "practice") renderScore(); });

    document.addEventListener("visibilitychange", () => {
      if (document.hidden && Player.running) {
        if (state.screen === "kids") { Player.stop(); kids.demoStep = -1; renderKids(false); return; }
        if (Player.demoActive) togglePlay();
        settings.metronome = false;
        Player.stop();
        renderPractice();
      }
    });

    // Napi gyakorlási idő: csak aktív használat számít.
    setInterval(() => {
      if (state.screen !== "home" && !document.hidden && (Player.running || Date.now() - state.lastInteraction < 30000)) {
        PracticeLog.add(5);
      }
    }, 5000);
  }

  /* ================= Indítás ================= */
  applyTheme();
  settings.metronome = false; // a metronóm sosem indul magától
  Player.init({
    beatsPerBar: () => (state.screen === "kids" && kids.timeline ? kids.timeline.bpb : state.timeline ? state.timeline.bpb : 4),
    onBeat: (beat, countIn) => { if (state.screen === "practice") onBeat(beat, countIn); },
    onDemoStep: (index) => (state.screen === "kids" ? kidsOnDemoStep(index) : onDemoStep(index)),
    onDemoEnd: () => (state.screen === "kids" ? kidsOnDemoEnd() : onDemoEnd()),
  });
  Player.setTempo(settings.tempo);
  setupKeyInput($("#keys"), pressKey);
  setupKeyInput($("#kidsKeys"), kidsPress);
  setupComputerKeyboard();
  bindEvents();
  showScreen("home");
  if (!Store.get("onboarded", false)) openOnboarding();
})();
</script>
</body>
</html>
